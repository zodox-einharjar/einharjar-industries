services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Local dev only: .env.dev points at the dev copy of the database (never the live one)
    # and a separate EVE developer app. Production runs from docker-compose.prod.yml on TrueNAS.
    env_file: .env.dev
    # Source is mounted and uvicorn reloads on save, like the frontend dev server.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    volumes:
      # SDE SQLite is not baked into the image — mount the file from the host.
      - ./backend/data:/app/data
      - ./backend/app:/app/app

  discord-bot:
    build:
      context: ./backend
    restart: unless-stopped
    command: python -m app.discord.main
    env_file: .env.dev
    # Not started locally — production's bot already uses the token. Opt in with
    # `docker compose --profile discord up` and a separate test bot token in .env.dev.
    profiles: ["discord"]
    # Inherits the backend image's HEALTHCHECK (curls :8000/health), but this
    # container runs the bot, not uvicorn — nothing listens on :8000 here.
    healthcheck:
      disable: true
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Preserve node_modules and .next from the image layer
      - frontend_nm:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  frontend_nm:
  frontend_next:
